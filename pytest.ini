[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = tests.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --reuse-db
    --cov-config=.coveragerc
    --cov=wallet
    --cov=betting
    --cov=users
    --cov=audit
    --cov-report=term-missing
    --cov-fail-under=80
filterwarnings =
    ignore::DeprecationWarning
